body:
  operationName: GetAllBlogs
  query: |
    fragment TagFragment on ContentfulTag {
      id
      name
    }

    fragment TaxonomyFragment on TaxonomyConcept {
      id
    }

    fragment ContentfulMetadataFragment on ContentfulMetadata {
      concepts {
        ...TaxonomyFragment
      }
      tags {
        ...TagFragment
      }
    }

    fragment SysFragment on Sys {
      environmentId
      firstPublishedAt
      id
      locale
      publishedAt
      publishedVersion
      spaceId
    }

    fragment AssetFragment on Asset {
      contentfulMetadata {
        ...ContentfulMetadataFragment
      }
      contentType
      description
      fileName
      height
      size
      sys {
        ...SysFragment
      }
      title
      url
      width
    }

    fragment BlogFragment on BlogPost {
      heroImage {
        ...AssetFragment
      }
      thumbnail {
        ...AssetFragment
      }
      title
      subtitle
      description
      category
      slug
      body
      publishDate
      sys {
        ...SysFragment
      }
      contentfulMetadata {
        ...ContentfulMetadataFragment
      }
      authorsCollection(limit: 5) {
        items {
          sys {
            id
          }
          # name
          # shortBio
          # image {
            # url
          # }
        }
      }
    }

    query GetAllBlogs(
      $skip: Int
      $limit: Int
      $preview: Boolean
      $locale: String
      $where: BlogPostFilter
      $order: [BlogPostOrder]
    ) {
      blogPostCollection(
        skip: $skip
        limit: $limit
        preview: $preview
        locale: $locale
        where: $where
        order: $order
      ) {
        total
        limit
        items {
          ...BlogFragment
        }
      }
    }
  variables: |-
    {
      "limit": 10,
      "skip": 0,
      "order": ["publishDate_DESC"],
      "where": {
        "publishDate_exists": true
      }
    }
