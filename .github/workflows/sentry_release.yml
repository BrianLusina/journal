name: Sentry Release

on:
  push:
    branches:
      - 'staging'
      - 'production'

jobs:
  release:
    name: Sentry Release

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use NodeJS
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Use Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # With SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT set, @sentry/vite-plugin (vite.config.mts)
    # creates the release for this commit and uploads the dist/ source maps during the build.
    - name: Build and upload source maps
      run: bun run build
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        VITE_ENV: ${{ github.ref_name }}
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        VITE_CONTENTFUL_CMS_SPACE_ID: ${{ secrets.CONTENTFUL_CMS_SPACE_ID }}
        VITE_CONTENTFUL_CMS_GRAPHQL_URL: ${{ secrets.CONTENTFUL_CMS_GRAPHQL_URL }}
        VITE_CONTENTFUL_CMS_API_KEY: ${{ secrets.CONTENTFUL_CMS_API_KEY }}
        VITE_CONTENTFUL_CMS_REST_API_URL: ${{ secrets.CONTENTFUL_CMS_REST_API_URL }}
        VITE_CONTENTFUL_CMS_PREVIEW_REST_API_URL: ${{ secrets.CONTENTFUL_CMS_PREVIEW_REST_API_URL }}
        VITE_CONTENTFUL_CMS_ENVIRONMENT: ${{ secrets.CONTENTFUL_CMS_ENVIRONMENT }}
        VITE_CONTENTFUL_CMS_PREVIEW: ${{ secrets.CONTENTFUL_CMS_PREVIEW }}
