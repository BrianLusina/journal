name: E2E update baselines

# Adding the `update-baselines` label to a PR re-records the article inventory, the accessibility
# baseline and the screenshots from that PR's Vercel preview, and commits them to the PR branch.
# A commit pushed with GITHUB_TOKEN doesn't start other workflows, so Tests and Lint don't run on
# it; E2E still does (Vercel redeploys). Push a later commit before merging if those checks are required.
on:
  pull_request:
    types: [labeled]

# The label is part of the group, so adding an unrelated label never cancels a recording.
concurrency:
  group: e2e-update-baselines-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event.label.name == 'update-baselines'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Find the preview of the PR's head commit
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          statuses=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&per_page=1" --jq '.[0].statuses_url // empty')
          url=""
          if [ -n "$statuses" ]; then
            url=$(gh api "$statuses" --jq '[.[] | select(.state == "success")][0].environment_url // empty')
          fi
          if [ -z "$url" ]; then
            echo "::error::No Vercel deployment for this commit yet. Wait for the preview, then add the label again."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  record:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ needs.resolve.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # setup-bun needs unzip, which the Playwright image may lack; the image has Node, so use npm.
      - name: Use Bun
        run: npm install -g bun@1.3.14
      - run: bun install --frozen-lockfile
      - name: Record JSON baselines
        run: E2E_RECORD=1 bunx playwright test --project=blog --grep @record
      - name: Record screenshots
        run: bunx playwright test --project=blog --grep @visual --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-baselines
          path: |
            e2e/baseline
            e2e/blog/__screenshots__
          retention-days: 1

  commit:
    needs: [resolve, record]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Commit on top of the commit the baselines were recorded from; the push below is
      # conditional on the branch still pointing at it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: e2e-baselines
          path: e2e
      - name: Commit
        env:
          URL: ${{ needs.resolve.outputs.url }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/baseline e2e/blog/__screenshots__
          git diff --cached --quiet && echo "Baselines unchanged" && exit 0
          git commit -m "test(e2e): update baselines from $URL"
          # Push only if the branch still points at the recorded commit (fails if it moved, was
          # reset or was deleted). The new commit sits on that commit, so this is a fast-forward.
          git push --force-with-lease="refs/heads/${{ github.head_ref }}:${{ github.event.pull_request.head.sha }}" origin "HEAD:refs/heads/${{ github.head_ref }}"
      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label update-baselines
