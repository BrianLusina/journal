# Reference: https://github.com/docker/build-push-action
# The image takes its configuration from the container's environment at runtime (see the README),
# so it is built without build arguments and the same image runs in every environment.
name: Docker Build

on:
  push:
    branches: [ production, staging ]

jobs:
  push_to_registry:
    name: Pushes the Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Registry names must be lowercase; the owner may not be.
    - name: Image name
      id: image
      run: echo "name=ghcr.io/${OWNER,,}/journal" >> "$GITHUB_OUTPUT"
      env:
        OWNER: ${{ github.repository_owner }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
