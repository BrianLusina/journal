name: Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Bundle Application

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use NodeJS
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Use Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run Build
      run: bun run build
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        VITE_ENV: production
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        CONTENTFUL_CMS_SPACE_ID: ${{ secrets.CONTENTFUL_CMS_SPACE_ID }}
        CONTENTFUL_CMS_GRAPHQL_URL: ${{ secrets.CONTENTFUL_CMS_GRAPHQL_URL }}
        CONTENTFUL_CMS_API_KEY: ${{ secrets.CONTENTFUL_CMS_API_KEY }}
        CONTENTFUL_CMS_REST_API_URL: ${{ secrets.CONTENTFUL_CMS_REST_API_URL }}
        CONTENTFUL_CMS_PREVIEW_REST_API_URL: ${{ secrets.CONTENTFUL_CMS_PREVIEW_REST_API_URL }}
        CONTENTFUL_CMS_ENVIRONMENT: ${{ secrets.CONTENTFUL_CMS_ENVIRONMENT }}
        CONTENTFUL_CMS_PREVIEW: ${{ secrets.CONTENTFUL_CMS_PREVIEW }}

    - name: Check bundle size budget
      run: bun run check:bundle-size

    - uses: actions/upload-artifact@v4
      with:
        name: build
        path: apps/blog/dist/

    - name: Build Storybook
      run: bun run storybook:build
