name: Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Bundle Application

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use NodeJS
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Use Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile
      env:
        CYPRESS_INSTALL_BINARY: 0

    - name: Run Build
      run: bun run build
      env:
        VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        VITE_ENV: production
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        VITE_CONTENTFUL_CMS_SPACE_ID: ${{ secrets.CONTENTFUL_CMS_SPACE_ID }}
        VITE_CONTENTFUL_CMS_GRAPHQL_URL: ${{ secrets.CONTENTFUL_CMS_GRAPHQL_URL }}
        VITE_CONTENTFUL_CMS_API_KEY: ${{ secrets.CONTENTFUL_CMS_API_KEY }}
        VITE_CONTENTFUL_CMS_REST_API_URL: ${{ secrets.CONTENTFUL_CMS_REST_API_URL }}
        VITE_CONTENTFUL_CMS_PREVIEW_REST_API_URL: ${{ secrets.CONTENTFUL_CMS_PREVIEW_REST_API_URL }}
        VITE_CONTENTFUL_CMS_ENVIRONMENT: ${{ secrets.CONTENTFUL_CMS_ENVIRONMENT }}
        VITE_CONTENTFUL_CMS_PREVIEW: ${{ secrets.CONTENTFUL_CMS_PREVIEW }}

    - uses: actions/upload-artifact@v4
      with:
        name: build
        path: dist/
