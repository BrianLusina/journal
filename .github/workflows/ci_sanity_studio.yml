# Builds Sanity Studio on every push, and deploys it only from staging and production. A hosted Studio's
# dataset is fixed at build time, so each of those branches deploys its own Studio (hostname and app ID
# from the GitHub Environment named after the branch) against the dataset of the same name, and
# `sanity deploy` uploads that branch's schema to that dataset. Every other branch only builds.
name: CI Sanity Studio

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build Sanity Studio
    runs-on: ubuntu-latest
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use NodeJS
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Use Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      working-directory: studio
      run: bun install --frozen-lockfile

    - name: Type-check
      working-directory: studio
      run: bun run typecheck

    - name: Build
      working-directory: studio
      run: bun run build

    # packages/cms checks its GROQ projections against schema.json, so it must match the schema.
    - name: Check schema.json is current
      working-directory: studio
      run: |
        bun run schema:extract
        if ! git diff --exit-code schema.json; then
          echo "::error file=studio/schema.json::schema.json is out of date: run 'bun run schema:extract' in studio/ and commit it."
          exit 1
        fi

  deploy:
    name: Deploy Sanity Studio (${{ github.ref_name }})
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: sanity-studio-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_APP_ID: ${{ secrets.SANITY_STUDIO_APP_ID }}
      SANITY_STUDIO_HOSTNAME: ${{ secrets.SANITY_STUDIO_HOSTNAME }}
      SANITY_STUDIO_TITLE: ${{ vars.SANITY_STUDIO_TITLE }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
    # Without its own Environment, a branch would fall back to the repository's values and could deploy
    # over the other branch's Studio. The dataset must be named after the branch.
    - name: Check the Environment targets this branch's dataset
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        if [ "$SANITY_STUDIO_DATASET" != "$BRANCH" ]; then
          echo "::error::The '$BRANCH' Environment must set SANITY_STUDIO_DATASET=$BRANCH (it is '${SANITY_STUDIO_DATASET:-unset}')."
          exit 1
        fi
        if [ -z "$SANITY_STUDIO_HOSTNAME" ] || [ -z "$SANITY_AUTH_TOKEN" ]; then
          echo "::error::The '$BRANCH' Environment needs SANITY_STUDIO_HOSTNAME and SANITY_AUTH_TOKEN."
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v4

    - name: Use NodeJS
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Use Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      working-directory: studio
      run: bun install --frozen-lockfile

    - name: Build and deploy
      working-directory: studio
      run: bun run deploy --url "$SANITY_STUDIO_HOSTNAME" --yes
