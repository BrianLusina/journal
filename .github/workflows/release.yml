name: Release
on:
  push:
    branches:
      - production
      - staging

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      # semantic-release only tags and writes the GitHub release (.releaserc.json), so it needs
      # neither the app's dependencies nor a build; the Build workflow builds every push.
      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
