name: E2E

# Runs the Playwright suite (e2e/) against every Vercel deployment, and smoke-tests production
# every 30 minutes. See "End-to-end" in docs/ARCHITECTURE.md.
on:
  deployment_status:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment to test
        required: true
        default: https://blog.brianlusina.com

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    # Same image as e2e-update-baselines.yml, so screenshots match the ones they are compared with.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.base_url || 'https://blog.brianlusina.com' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      # setup-bun needs unzip, which the Playwright image may lack; the image has Node, so use npm.
      - name: Use Bun
        run: npm install -g bun@1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production smoke
        if: github.event_name == 'schedule'
        run: bunx playwright test --project=blog --grep @smoke

      - name: Full suite
        if: github.event_name != 'schedule'
        run: |
          echo "Testing $E2E_BASE_URL"
          bunx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
